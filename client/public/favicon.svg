<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background matching app theme -->
  <rect width="32" height="32" rx="6" fill="#111827"/>
  
  <!-- Stacked green pages/bars - tilted left -->
  <rect x="5" y="7" width="13" height="18" rx="2" fill="#16a34a" opacity="0.4" transform="rotate(-8 11.5 16)"/>
  <rect x="7" y="6" width="13" height="18" rx="2" fill="#22c55e" opacity="0.6" transform="rotate(-4 13.5 15)"/>
  <rect x="9" y="5" width="13" height="18" rx="2" fill="#4ade80" opacity="0.8"/>
  
  <!-- Wheat stalk - golden -->
  <g transform="translate(20, 14)">
    <!-- Main stem -->
    <line x1="0" y1="10" x2="0" y2="-6" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left kernels -->
    <ellipse cx="-2.2" cy="1" rx="2.2" ry="1" fill="#fbbf24" transform="rotate(-25 -2.2 1)"/>
    <ellipse cx="-2" cy="-2" rx="1.9" ry="0.9" fill="#fbbf24" transform="rotate(-20 -2 -2)"/>
    <ellipse cx="-1.5" cy="-4.5" rx="1.5" ry="0.7" fill="#fbbf24" transform="rotate(-15 -1.5 -4.5)"/>
    <!-- Right kernels -->
    <ellipse cx="2.2" cy="1" rx="2.2" ry="1" fill="#fbbf24" transform="rotate(25 2.2 1)"/>
    <ellipse cx="2" cy="-2" rx="1.9" ry="0.9" fill="#fbbf24" transform="rotate(20 2 -2)"/>
    <ellipse cx="1.5" cy="-4.5" rx="1.5" ry="0.7" fill="#f59e0b" transform="rotate(15 1.5 -4.5)"/>
    <!-- Top kernel -->
    <ellipse cx="0" cy="-6" rx="1.2" ry="0.6" fill="#f59e0b"/>
  </g>
</svg>
