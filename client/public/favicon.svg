<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Wheat stalk -->
  <g transform="translate(16,16)" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Main stem -->
    <line x1="0" y1="12" x2="0" y2="-8"/>
    <!-- Grain kernels -->
    <ellipse cx="-3" cy="-2" rx="2.5" ry="1.2" fill="#fbbf24" transform="rotate(-30 -3 -2)"/>
    <ellipse cx="3" cy="-2" rx="2.5" ry="1.2" fill="#fbbf24" transform="rotate(30 3 -2)"/>
    <ellipse cx="-3" cy="-5.5" rx="2.2" ry="1.1" fill="#fbbf24" transform="rotate(-25 -3 -5.5)"/>
    <ellipse cx="3" cy="-5.5" rx="2.2" ry="1.1" fill="#fbbf24" transform="rotate(25 3 -5.5)"/>
    <ellipse cx="0" cy="-8.5" rx="1.8" ry="1" fill="#fbbf24"/>
  </g>
</svg>
